<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Adding CSS styles -->
    <link rel="stylesheet" href="./styles/reset.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/style.css" />

    <meta name="description" content="A vanilla JavaScript movie catalog with dynamic cards and a responsive Bootstrap UI">
    <meta property="og:title" content="Movies Project">
    <meta property="og:description" content="Browse recommended movies and explore the catalog.">
    <meta property="og:type" content="website">

    <title>Movies Project</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="./index.html">Movies Project</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./pages/about.html"
                  >About this Project</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./pages/contact.html">Contact</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./pages/add.html">Add Movie</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <h1 class="text-center my-4">Recommended Movies</h1>

    <main class="container">
      <div id="status" class="text-center text-muted my-3" role="status" aria-live="polite"> Loading movies...</div>
      <div id="card-container" class="row g-3"></div>

      <!-- Footer -->
      <footer class="pt-3 mt-4 border-top text-muted small">
        <div class="d-flex flex-wrap justify-content-between gap-2">
          <span>©<span id="year"></span> Movies Project</span>
          <span
            >Built by <strong>Luis Vargas</strong> •
            <a
              href="https://github.com/1LuisVargas"
              target="_blank"
              rel="noreferrer"
            >
              GitHub</a
            ></span
          >
        </div>
      </footer>
    </main>

    <!-- Adding JS scripts -->
    <script src="./public/bundle.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
