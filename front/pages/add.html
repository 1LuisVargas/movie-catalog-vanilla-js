<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Adding jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Adding CSS styles -->
    <link rel="stylesheet" href="../styles/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../styles/style.css" />

    <title>Add Movies</title>
  </head>
  <body>
    <!-- Adding the navigation bar -->
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Movies Project</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="../index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./about.html">About this Project</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./contact.html">Contact</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Add Movie</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container">
      <h1 class="text-center my-4">New Movie</h1>
      <!-- Adding the form -->
      <form id="add-form">
        <div class="mb-2">
          <label for="poster" class="form-label">Poster URL</label>
          <input
            type="url"
            class="form-control mt-1"
            id="poster"
            name="poster"
            required
            placeholder="https://example.com/poster.jpg"
          />
        </div>
        <div class="mb-2">
          <label for="title" class="form-label">Title </label>
          <input
            type="text"
            class="form-control mt-1"
            id="title"
            name="title"
            required
            placeholder="The Shawshank Redemption"
          />
        </div>
        <div class="mb-2">
          <label for="year" class="form-label">Year </label>
          <input
            type="number"
            class="form-control mt-1"
            id="year"
            name="year"
            required
            min="1900"
            max="2025"
            placeholder="1994"
          />
        </div>
        <div class="mb-2">
          <label for="director" class="form-label">Director </label>
          <input
            type="text"
            class="form-control mt-1"
            id="director"
            name="director"
            required
            placeholder="Frank Darabont"
          />
        </div>
        <div class="mb-2">
          <label for="duration" class="form-label">Duration</label>
          <input
            type="text"
            class="form-control mt-1"
            id="duration"
            name="duration"
            required
            placeholder="2h 22m"
          />
        </div>

        <label for="genre" class="form-label mb-1 mt-3">Genre </label>
        <!-- Adding all the genre checkboxes -->
        <div class="mb-3">
          <label for="action" class="form-check-label">Action </label>
          <input
            class="form-check-input"
            type="checkbox"
            id="action"
            name="genre"
            value="Action"
          />
          <label for="action" class="form-check-label">Thriller </label>
          <input
            class="form-check-input"
            type="checkbox"
            id="thriller"
            name="genre"
            value="Thriller"
          />
          <label for="mystery" class="form-check-label">Mystery </label>
          <input
            class="form-check-input"
            type="checkbox"
            id="mystery"
            name="genre"
            value="Mystery"
          />
          <label for="adventure" class="form-check-label">Adventure </label>
          <input
            type="checkbox"
            id="adventure"
            name="genre"
            value="Adventure"
            class="form-check-input"
          />
          <label for="comedy" class="form-check-label">Comedy </label>
          <input
            type="checkbox"
            id="comedy"
            name="genre"
            value="Comedy"
            class="form-check-input"
          />
          <label for="fantasy" class="form-check-label">Fantasy </label>
          <input
            type="checkbox"
            id="fantasy"
            name="genre"
            value="Fantasy"
            class="form-check-input"
          />
          <label for="sci-Fi" class="form-check-label">Sci-Fi </label>
          <input
            type="checkbox"
            id="sci-Fi"
            name="genre"
            value="Sci-Fi"
            class="form-check-input"
          />
          <label for="drama" class="form-check-label">Drama </label>
          <input
            type="checkbox"
            id="drama"
            name="genre"
            value="Drama"
            class="form-check-input"
          />
          <label for="horror" class="form-check-label">Horror </label>
          <input
            type="checkbox"
            id="horror"
            name="genre"
            value="Horror"
            class="form-check-input"
          />
        </div>
        <!-- End of all the genre checkboxes -->
        <div>
          <label class="form-label"
            >IMDB Rating
            <input
              type="number"
              class="form-control mt-1"
              id="rate"
              name="rate"
              required
              min="1"
              max="10"
              step="0.1"
              placeholder="7.8"
            />
          </label>
        </div>
        <div id="buttons" class="mt-3">
          <button type="submit" class="btn btn-primary">Add Movie</button>
          <button type="button" id="clear-button" class="btn btn-secondary">Clear</button>
        </div>
      </form>
    </main>

    <!-- Adding Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Adding JS scripts -->
    <script src="../scripts/add.js"></script>
  </body>
</html>
