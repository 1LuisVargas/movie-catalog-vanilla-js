<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Adding jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Adding CSS styles -->
    <link rel="stylesheet" href="../styles/reset.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <title>Add Movies</title>
</head>
<body>

    <!-- Adding the navigation bar -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Movies Project</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="../index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./about.html">About this Project</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="./contact.html">Contact</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Add Movie</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <h1 class="text-center my-4">New Movie</h1>

    <!-- Adding the form -->
    <main class="container">
        <form id="add-form">
            <div class="mb-3">
                <label for="poster" class="form-label">Poster URL
                    <input type="url" class="form-control" id="poster" name="poster" required>
                </label>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label">Title
                    <input type="text" class="form-control" id="title" name="title" required>
                </label>
            </div>
            <div class="mb-3">
                <label for="year" class="form-label">Year
                    <input type="number" class="form-control" id="year" name="year" required min="1900" max="2025">
                </label>
            </div>
            <div class="mb-3">
                <label for="director" class="form-label">Director
                    <input type="text" class="form-control" id="director" name="director" required>
                </label>
            </div>
            <div class="mb-3">
                <label for="duration" class="form-label">Duration in Minutes
                    <input type="number" class="form-control" id="duration" name="duration" required min="20" max="300">
                </label>
            </div>

            <!-- Adding all the genre checkboxes -->
            <div class="mb-3">
                <label for="Action" class="form-label">Action
                    <input type="checkbox" id="Action" name="genre">
                </label>
                <label for="Adventure" class="form-label">Adventure
                    <input type="checkbox" id="Adventure" name="genre">
                </label>
                <label for="Comedy" class="form-label">Comedy
                    <input type="checkbox" id="Comedy" name="genre">
                </label>
                <label for="Fantasy" class="form-label">Fantasy
                    <input type="checkbox" id="Fantasy" name="genre">
                </label>
                <label for="Sci-Fi" class="form-label">Sci-Fi
                    <input type="checkbox" id="Sci-Fi" name="genre">
                </label>
                <label for="Drama" class="form-label">Drama
                    <input type="checkbox" id="Drama" name="genre">
                </label>
            </div>
            <!-- End of all the genre checkboxes -->
            <div class="mb-3">
                <label for="rate" class="form-label">IMDB Rating</label>
                <input type="number" class="form-control" id="rate" name="rate" required>
            </div>
            <div id="buttons">
                <button type="submit" class="btn btn-primary">Add Movie</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
        </form>
    </main>
</body>
</html>
